<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiple audio test</title>
</head>
<body>
<button onclick="next()">Play</button>
<script>
  const url = 'https://analytics.wikimedia.org/published/datasets/ml/tts/experiment-v2/'
  let manifest;
  let i = 0;

  const load = async () => {
    const response = await fetch(`${ url }enwiki/663/1376497718/manifest.json`); // Apollo 8
    manifest = await response.json();
  };

  const next = () => {
    const section = manifest.sections[i];
    if (!section) {
      return;
    }

    i++;

    const audio = new Audio(`${ url }${section.audio.key}`);
    audio.preload = 'auto';
    audio.play();
    audio.addEventListener('ended', () => {
      const now = Date.now();
      const interval = setInterval(() => {
        document.write('<p>' + Math.round((Date.now() - now) / 1000) + '</p>');
      }, 1000);
      setTimeout(() => {
        clearInterval(interval);
        next();
      }, 300000);
    });
  };

  load();
</script>
</body>
</html>
